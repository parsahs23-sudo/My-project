name: Windows Build Check



on:

  workflow_dispatch:



jobs:

  win-test:

    runs-on: windows-latest

    timeout-minutes: 60

    steps:

      - name: Initialize Runner

        uses: actions/checkout@v4



      - name: Setup Remote Environment

        run: |

          # تنظیم رمز عبور برای یوزر ادمین ویندوز

          net user runneradmin Cynet@2026!

          

          # فعال‌سازی ریموت دسکتاپ در رجیستری و فایروال

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          

          # نصب خودکار Tailscale روی ویندوز سرور

          choco install tailscale -y

          

          # اتصال سرور به شبکه خصوصی شما (کلید خود را جایگزین کنید)

          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="tskey-auth-kf7t7jHSHk11CNTRL-ECQ2N1g8D3Mgt172USg23MhkLCNuv9kte" --unattended --reset

          

          # چاپ آی‌پی و مشخصات ورود در لاگ گیت‌هاب

          Write-Host "========================================="

          Write-Host "WINDOWS SERVER RDP IP:"

          & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          Write-Host "Username: runneradmin"

          Write-Host "Password: Cynet@2026!"

          Write-Host "========================================="



      - name: Keep Environment Active

        run: Start-Sleep -Seconds 3300
